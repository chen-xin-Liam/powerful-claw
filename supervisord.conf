[program:ai_assistant]
command=python src/main.py
directory=E:\ywdclaw
user=root
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=logs/supervisor_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=logs/supervisor_stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=PYTHONPATH="E:\ywdclaw"

[program:celery_worker]
command=celery -A src.services.celery_service worker --loglevel=info
directory=E:\ywdclaw
user=root
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=logs/celery_worker_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=logs/celery_worker_stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=PYTHONPATH="E:\ywdclaw"

[program:celery_beat]
command=celery -A src.services.celery_service beat --loglevel=info
directory=E:\ywdclaw
user=root
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=logs/celery_beat_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=logs/celery_beat_stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=PYTHONPATH="E:\ywdclaw"

[supervisord]
logfile=logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[supervisorctl]
serverurl=http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=127.0.0.1:9001
name: Docs — link check & wiki sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'config/**/*.md'
      - 'scripts/check_doc_links.py'
      - '.github/workflows/sync-to-wiki.yml'
  workflow_dispatch:

jobs:
  link-check:
    name: Validate markdown relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run link checker
        run: python3 scripts/check_doc_links.py

  sync-wiki:
    name: Sync docs to GitHub Wiki
    needs: link-check
    runs-on: ubuntu-latest
    # 链接检查未通过时不同步，避免把失效链接推到 Wiki
    steps:
      - uses: actions/checkout@v4
      - name: Flatten docs for wiki
        # GitHub Wiki 不支持子目录路由：zh/INDEX.md 需扁平化为页面 zh-INDEX，
        # 内部链接去掉 .md；docs 之外的链接转为仓库 blob URL
        run: python3 scripts/build_wiki_staging.py docs wiki-staging
      - name: Push multilingual docs to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          # 同步扁平化后的暂存目录（en/zh/ru/fr 页面名带语言前缀）
          path: wiki-staging
          # strategy=init：单提交强制推送，与旧 Wiki 完全对齐，删除已不存在的页面
          strategy: init
          token: ${{ secrets.WIKI_SYNC_TOKEN }}
          commit-message: "docs: sync multilingual wiki (en/zh/ru/fr)"

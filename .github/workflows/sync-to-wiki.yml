name: Sync Docs to Wiki
on:
  push:
    branches: [ main ]  # 监听 main 分支的推送
    paths:
      - 'docs/**'       # 只有 docs/ 目录下文件变更才触发

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync docs to wiki
        uses: newrelic/wiki-sync-action@v2
        with:
          source: docs/          # 你的文档目录
          destination: ./        # 同步到 Wiki 根目录
          gitHubToken: ${{ secrets.WIKI_SYNC_TOKEN }}  # 从 Secrets 读取
          commitMessage: "docs: auto-sync from main branch"
          
name: Sync Docs to Wiki
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/
          token: ${{ secrets.WIKI_SYNC_TOKEN }}
          commit-message: "docs: auto-sync from main branch"
          
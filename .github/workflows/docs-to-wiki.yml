name: Sync docs to Wiki simple
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs
          delete: true # 强制删除wiki多余页面，全量覆盖
          wiki-token: ${{ secrets.WIKI_SYNC_TOKEN }}
          commit-message: "docs: force sync wiki"

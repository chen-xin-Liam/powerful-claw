name: 强制同步 docs 文件夹到 Wiki (WIKI_SYNC_TOKEN)
on:
  workflow_dispatch: # 只能手动运行

permissions:
  contents: read # 只需要读主仓库代码，wiki推送靠token

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone Wiki repo with WIKI_SYNC_TOKEN
        run: |
          # 拼接带token的git地址
          WIKI_URL="https://${{ secrets.WIKI_SYNC_TOKEN }}@github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}.wiki.git"
          git clone "$WIKI_URL" wiki-tmp

      - name: Rsync docs -> wiki-tmp 强制全量覆盖
        run: |
          rsync -av --delete docs/ wiki-tmp/
          # 自动把README.md映射为Wiki首页Home.md（不存在才复制）
          if [ -f "wiki-tmp/README.md" ] && [ ! -f "wiki-tmp/Home.md" ]; then
            cp wiki-tmp/README.md wiki-tmp/Home.md
          fi

      - name: Commit & Push Wiki
        working-directory: ./wiki-tmp
        run: |
          git config user.name "wiki-sync-bot"
          git config user.email "wiki-sync-bot@noreply.github.com"
          git add .
          git commit -m "docs: force sync docs to wiki, ref: ${{ github.sha }}" || echo "No changes, skip commit"
          git push

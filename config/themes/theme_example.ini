; ============================================================
; 主题配置文件示例
; 复制此文件并修改，然后放入 config/themes/ 文件夹即可加载
; ============================================================

[Theme]
name=My Custom Theme       ; 主题名称（显示在主题列表中）
author=Your Name          ; 作者名称
version=1.0               ; 版本号
description=我的自定义主题   ; 主题描述

; ============================================================
; 暗色模式颜色配置
; ============================================================
[ColorsDark]
; 主色调 - 用于按钮、链接等
primary=#1E90FF           ; 主颜色
secondary=#00BFFF         ; 次要颜色
accent=#87CEEB            ; 强调颜色

; 背景色
background=#0A192F        ; 主背景色
surface=#112240           ; 表面背景色
card=#1A365D              ; 卡片背景色
border=#2D4A6F            ; 边框颜色

; 文字颜色
text_primary=#FFFFFF      ; 主要文字颜色
text_secondary=#94A3B8    ; 次要文字颜色
text_disabled=#475569     ; 禁用文字颜色

; 状态颜色
success=#10B981           ; 成功状态颜色
warning=#F59E0B           ; 警告状态颜色  
error=#EF4444             ; 错误状态颜色
info=#3B82F6              ; 信息状态颜色

; ============================================================
; 亮色模式颜色配置
; 如果省略此部分，系统会自动从暗色模式生成互补色
; ============================================================
[ColorsLight]
primary=#0066CC
secondary=#0099FF
accent=#5BB5E0
background=#F8FAFC
surface=#FFFFFF
card=#F1F5F9
border=#E2E8F0
text_primary=#1E293B
text_secondary=#64748B
text_disabled=#94A3B8
success=#059669
warning=#D97706
error=#DC2626
info=#2563EB

; ============================================================
; 颜色格式说明：
; - 使用十六进制颜色代码，格式为 #RRGGBB
; - 支持三位简写格式，如 #FFF 等同于 #FFFFFF
; - 建议使用对比度较高的颜色组合
; ============================================================
